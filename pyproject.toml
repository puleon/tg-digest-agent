[project]
name = "tgdigest"
version = "0.1.0"
description = "Agentic search and personalized digest over thematic Telegram channels, running on local CPU-only models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Leonid Pugachev", email = "puleon@mail.ru" }]
keywords = ["telegram", "rag", "agents", "langgraph", "llama.cpp", "langfuse"]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "qdrant-client>=1.12",
    "httpx[socks]>=0.28",
    "openai>=1.60",
    "typer>=0.15",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "orjson>=3.10",
    "tenacity>=9.0",
    "pillow>=11.0",
    "telethon>=1.38",
    "langgraph>=1.0",
    "selectolax>=0.3",
]

[project.scripts]
tgdigest = "tgdigest.cli:app"

[dependency-groups]
ml = [
    # embeddings (BGE-M3 dense + sparse) and the distilled classifiers; CPU-only torch wheels
    "FlagEmbedding>=1.3",
    "torch>=2.4",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-httpx>=0.35",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "types-PyYAML",
    "aiosqlite>=0.21",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgdigest"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",    # assert is fine in tests and invariants
    "RUF001",  # the corpus is Russian: Cyrillic in string literals is expected
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "ASYNC240"]  # test credentials; fakes may block on disk
"scripts/**" = ["S603", "S607", "S311", "ASYNC240"]  # subprocess, seeded sampling, blocking io in one-off scripts

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*", "FlagEmbedding", "FlagEmbedding.*", "joblib", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs running services (postgres, qdrant, llm); skipped in CI",
]
addopts = "-m 'not integration' -q"

[tool.coverage.run]
source = ["tgdigest"]
