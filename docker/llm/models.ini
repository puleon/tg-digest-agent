; llama-server router presets (SPEC §4). One endpoint, models loaded on demand and evicted
; when --models-max is exceeded or after --sleep-idle-seconds. Keys = CLI flags without dashes.
version = 1

[*]
c = 16384
np = 2
cache-reuse = 256
jinja = true

; --- fast tier: mass operations + VLM (multimodal MoE, 3B active) --------------------------
; Thinking is off by default for the fast tier: at max_tokens ~200 it eats the whole budget and
; leaves `content` empty. Enable per request via chat_template_kwargs when needed.
[qwen3.6-35b-a3b]
model = /models/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-Q4_K_M.gguf
mmproj = /models/qwen3.6-35b-a3b/mmproj-Qwen3.6-35B-A3B-Q8_0.gguf
reasoning = off
; below ~1000 image tokens Qwen misreads Cyrillic (D1 probe); costs ~2x image latency
image-min-tokens = 1024

[gemma-4-26b-a4b]
model = /models/gemma-4-26b-a4b/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
mmproj = /models/gemma-4-26b-a4b/mmproj-BF16.gguf
reasoning = off

; --- heavy tier: synthesis and judge, loaded on demand -------------------------------------
[gpt-oss-120b]
model = /models/gpt-oss-120b/gpt-oss-120b-MXFP4.gguf
c = 32768
np = 1
